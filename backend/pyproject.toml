[project]
name = "pmstudio"
version = "0.0.0"
description = "PM Studio —— 单用户产品文档工作台"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "langgraph>=1.2",
    "litellm>=1.102",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "pdfminer.six>=20250506",
    "pydantic>=2.12",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.47",
    "argon2-cffi>=25.1.0",
    "pybreaker>=1.4,<2",
    # 登录限流的跨 worker 共享计数（高并发 P3）。`limits` 的原子 Lua 脚本已经
    # 写好并测过，自己写就是重造一遍 NOSCRIPT 回退与集群 hash tag。
    # 上界 <6：5.x 换策略 API 时不要被自动带上。
    "limits>=5,<6",
    # redis-py 的 asyncio 客户端。两个实测值必须显式给，不能用默认：
    #   · 连接池默认 100，200 并发直接 `MaxConnectionsError`（目标就是 200+）
    #   · 不设 `socket_timeout` 时 Redis"连上但不回包"会让登录卡 5 秒
    # 注：`limits` 的 `[redis]` extra 声明 `redis<8`，我们实测 8.1.0 全通过
    # （原子性 / 连接池 / 超时），所以上界放到 <9 而非跟着 extra 降级。
    "redis>=6,<9",
    "jieba>=0.42.1",
    "fastembed>=0.9.0",
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.7",
    "playwright>=1.64.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # litellm 内部 pydantic 的 ReadOnly 告警（第三方库自己的兼容提示，与我们无关）；
    # 只有真 HTTP 那条测试会走到它，别让它把测试输出搞脏。
    "ignore:Item 'summary' on TypedDict class:UserWarning",
]
markers = [
    # 需要真模型/真网络/首次下载模型的测试：默认不跑，显式 -m slow 才跑。
    "slow: requires network and/or downloads large models on first run",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pmstudio", "tests"]
