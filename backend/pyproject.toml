[project]
name = "pmstudio"
version = "0.0.0"
description = "PM Studio —— 单用户产品文档工作台"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "langgraph>=1.2",
    "litellm>=1.102",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "pdfminer.six>=20250506",
    "pydantic>=2.12",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.47",
    "argon2-cffi>=25.1.0",
    "pybreaker>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # litellm 内部 pydantic 的 ReadOnly 告警（第三方库自己的兼容提示，与我们无关）；
    # 只有真 HTTP 那条测试会走到它，别让它把测试输出搞脏。
    "ignore:Item 'summary' on TypedDict class:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pmstudio", "tests"]
