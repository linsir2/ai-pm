[project]
name = "pmstudio"
version = "0.1.0"
description = "PM Studio —— 把产品构思逐步收口成可确认的产品共识文档"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "litellm>=1.100",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

