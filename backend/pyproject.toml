[project]
name = "pmstudio"
version = "0.0.0"
description = "PM Studio —— 单用户产品文档工作台"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
    "litellm>=1.102",
    "pydantic>=2.12",
    "uvicorn>=0.47",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pmstudio", "tests"]
