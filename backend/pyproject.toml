[project]
name = "pmstudio"
version = "0.1.0"
description = "PM Studio —— 把产品构思逐步收口成可确认的产品共识文档"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "litellm>=1.100",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
# 开发工具：**必须在依赖里声明**，否则 README 的 `uv run pytest` / `uv run ruff` 跑不起来
# （原来只声明了 httpx，pytest / ruff 是"文档里承诺、环境里没有"）。
# `uv sync` 默认就把 dev 组装上；见 tests/bootstrap/test_repo_docs.py 的钉。
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

