name: CI

# 每次 push / PR 跑一遍：后端测试 + lint、前端类型 + 测试、接口零差。
#
# **为什么值得有**：这个仓有 250+ 个测试文件、684 次提交，但**没有 CI**——
# 于是"这些测试谁在跑"没有答案。补上它，是"工程化"最便宜的一步。

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # **必须**：pytest 的 `pythonpath = ["src", "."]` 依赖工作目录是 `backend/`
        # （`tests/test_dev_script.py` 用 `from scripts.dev import ...`，
        #  `tests/architecture/guards.py` 用 `from tests.architecture.guards import ...`）。
        # 工作目录不对 → 一批用例直接 ImportError。
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # ⚠️ **必须用 setup-python 的解释器**，不能用 uv 自己下载的那个：
      # 有些 Python 构建**没有** `sqlite3.Connection.enable_load_extension`
      # （`sqlite-vec` 靠它加载扩展）→ 扩展装不上 → 检索静默降级成纯 FTS5
      # → 一批向量相关的用例红。setup-python 装的是发行版/官方构建，**带扩展加载**。
      # `UV_PYTHON` 是为了显式钉住它（`backend/.python-version` 已经写了 3.13，
      # 但那只是"要哪个版本"，不保证"哪个构建"）。
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen --dev
        env:
          UV_PYTHON: "3.13"

      - name: lint
        run: uv run ruff check --no-cache .

      # compose 的 backend 服务 `env_file: ./backend/.env` —— 文件不存在会让
      # `docker compose config`（`tests/architecture/test_container_assets.py`）直接失败。
      # 那条用例**故意**把"env_file 缺失"当红灯（那正是它要抓的真问题，
      # 见其文档串），所以这里给它一个占位：构建阶段不读值，只是要文件在
      # （与下面的 build job 同一口径）。
      #
      # ⚠ 路径是 `.env.example` 而不是 `backend/.env.example`：**这个 job 的
      # `working-directory` 就是 `backend/`**（见文件顶部 defaults）。
      # 2026-10-23 修：写成 `backend/.env.example` → `cp: cannot stat ...`，
      # 这一步自己红了（build job 没有那个 working-directory，所以它那边是对的）。
      - name: 造占位 .env
        run: cp .env.example .env

      - name: 测试
        # ⚠️ **`-m "not slow"` 必须显式给**：`markers` 只是**注册**标记，
        # pytest 默认**会跑** slow 用例 → CI 会去下 90MB 的 ONNX 模型并调真模型 API
        # （慢、贵、还会因为网络抖而红）。
        run: uv run pytest -m "not slow" -q -p no:cacheprovider

      - name: 接口零差
        # 前后端接口清单必须逐字一致（`scripts/check_api_parity.py`）。
        # 它只读 OpenAPI、不连库；这里仍给一个合法 PG URL。
        env:
          PMSTUDIO_DATABASE_URL: postgresql://parity:parity@127.0.0.1:1/parity
        run: uv run python scripts/check_api_parity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 测试
        run: npx vitest run

  # **真的构建镜像**：Dockerfile 里的错（COPY 路径不在 context 内、缺依赖、
  # alpine 装不上 onnxruntime、`.dockerignore` 漏掉密钥）**没有一条会自己报错**——
  # 不构建一次，它们要等到部署时才炸。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose 的 backend 服务 `env_file: ./backend/.env` —— 文件不存在会让
      # `docker compose build` 直接失败（与"镜像能不能构建"无关）。造一个占位：
      # 构建阶段不读值，只是要文件在。
      - name: 造占位 .env
        run: cp backend/.env.example backend/.env

      - name: 构建镜像
        run: docker compose build
