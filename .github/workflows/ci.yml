name: CI

# 每次 push / PR：后端全量测试（真 PostgreSQL 18 + pgvector）、PgBouncer smoke、
# lint、前端类型 + 测试、接口零差、镜像构建。

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # pytest 的 `pythonpath = ["src", "."]` 依赖工作目录是 `backend/`。
        working-directory: backend
    services:
      postgres:
        # pgvector 0.8.7 + PostgreSQL 18；digest 与 compose 同一枚，避免浮动标签漂移。
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_DB: pmstudio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pmstudio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # 两套 URL 都指向同一个 service；fixture 会各自加上测试 schema 的 search_path。
      PMSTUDIO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pmstudio
      PMSTUDIO_TEST_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pmstudio
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen --dev
        env:
          UV_PYTHON: "3.13"

      - name: lint
        run: uv run ruff check --no-cache .

      # backup/restore 用真 PG18 `pg_dump -Fc`；Ubuntu 自带的 16 不兼容。
      - name: 装 PostgreSQL 18 客户端
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: 建 pgvector 扩展
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:postgres@127.0.0.1:5432/pmstudio", autocommit=True
          ) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY

      # compose 的 backend 服务 `env_file: ./backend/.env`；文件不存在会让
      # `docker compose config`（test_container_assets）直接失败。
      - name: 造占位 .env
        run: cp .env.example .env

      - name: 测试
        # **必须显式 -m "not slow"**：markers 只是注册，pytest 默认会跑 slow
        # （下 90MB 模型 + 调真模型 API）。全量直连真 PG，缺 URL 会 pytest.exit。
        run: uv run pytest -m "not slow" -q -p no:cacheprovider

      - name: 接口零差
        # 接口清单只读 OpenAPI，不连库；仍给同一套临时 PG 的合法 URL。
        env:
          PMSTUDIO_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pmstudio
        run: uv run python scripts/check_api_parity.py

  # 真 PgBouncer：compose 起 db → init（写 auth_file/角色）→ pgbouncer，
  # 再跑 `tests/e2e/test_pgbouncer.py`。用例缺 URL 会 fail（skip 视为失败）。
  pgbouncer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 造 env（示例值即可，CI 只用一次性容器）
        run: |
          cp backend/.env.example backend/.env
          cp backend/.env.ops.example backend/.env.ops

      - name: 起 db / init / pgbouncer
        run: |
          docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml up -d db init pgbouncer
          docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml wait init
          for _ in $(seq 1 60); do
            docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml ps --format json pgbouncer \
              | grep -q '"Health":"healthy"' && break
            sleep 2
          done
          docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml ps
          docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml ps --format json pgbouncer \
            | grep -q '"Health":"healthy"' || { echo "PgBouncer 6432 未 healthy" >&2; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        working-directory: backend
        run: uv sync --frozen --dev
        env:
          UV_PYTHON: "3.13"

      # skip 视为失败：缺 URL 时 test_pgbouncer.py 在 REQUIRE 下直接 fail。
      - name: PgBouncer smoke
        working-directory: backend
        env:
          # session 夹具（autouse）先要两个测试 URL；init 已建好 owner 角色。
          PMSTUDIO_TEST_DATABASE_URL: postgresql://pmstudio_owner:change-me-owner@127.0.0.1:5432/pmstudio
          PMSTUDIO_TEST_DIRECT_DATABASE_URL: postgresql://pmstudio_owner:change-me-owner@127.0.0.1:5432/pmstudio
          PMSTUDIO_TEST_PGBOUNCER_URL: postgresql://pmstudio_app:change-me-app@127.0.0.1:6432/pmstudio
          PMSTUDIO_TEST_PGBOUNCER_ADMIN_URL: postgresql://pmstudio_owner:change-me-owner@127.0.0.1:6432/pgbouncer
          PMSTUDIO_TEST_REQUIRE_PGBOUNCER: "1"
        run: uv run pytest tests/e2e/test_pgbouncer.py -q -p no:cacheprovider

      - name: 收尾
        if: always()
        run: docker compose -f docker-compose.yml -f .github/pgbouncer-ci.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 测试
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 造占位 .env
        run: cp backend/.env.example backend/.env

      - name: 构建镜像
        run: docker compose build
