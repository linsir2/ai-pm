# PM Studio 的 compose 形态：PostgreSQL + PgBouncer + 一次性 init/maintenance + 后端 + 前端（Caddy）+ Redis。
#
# **用法**：
#   cp backend/.env.example backend/.env           # app：model/key/app URL（pmstudio_app）
#   cp backend/.env.ops.example backend/.env.ops   # ops：bootstrap/owner URL、角色口令
#   # 然后把 .env.ops 里的 change-me-* 与首管理员全部改成真实值（首管理员必填，
#   # 空值会让 init --finalize 硬失败，compose 不会起 backend）
#   docker compose up -d --build
#   打开 http://localhost
#
# 启动顺序：db → init（bootstrap→schema→finalize）→ pgbouncer → backend。
# backend **不**跑迁移/seed；PgBouncer 先有 init 写好的 SCRAM auth_file 才启动。
#
# **这份 compose 与 `scripts/dev_stack.sh` 用同一套环境变量名**
# ——那是它们"等价"的根据（`tests/architecture/test_container_assets.py` 盯着）。

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: pmstudio-backend:local

services:
  backend:
    <<: *backend-image
    env_file:
      - ./backend/.env
    environment:
      PMSTUDIO_PORT: "8000"
      # 跨容器反代必须给：Caddy 在另一个容器里，源 IP 是 Caddy 的。
      PMSTUDIO_FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      PMSTUDIO_REDIS_URL: "redis://redis:6379/0"
      FASTEMBED_CACHE_PATH: "/root/.cache/fastembed"
    volumes:
      - pmstudio-data:/data
      - fastembed-cache:/root/.cache/fastembed
    depends_on:
      init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # **就绪**而不是存活：DB/PgBouncer 掉线时 /api/health 仍 200，不能拿它收流量。
      # 用系统 python（urllib 足够）：`uv run` 会再走一遍 sync，健康检查不该依赖网络。
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s

  init:
    <<: *backend-image
    # ops 配置只给一次性 job：backend 的 env_file 里没有 direct/bootstrap URL。
    env_file:
      - path: ./backend/.env.ops
        required: false
    environment:
      PMSTUDIO_PGBOUNCER_AUTH_FILE: "/pgbouncer-auth/userlist.txt"
      PMSTUDIO_PGBOUNCER_AUTH_UID: "70"
    volumes:
      - pgbouncer-auth:/pgbouncer-auth
    command: ["uv", "run", "--no-sync", "python", "scripts/init_db.py", "--all"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  maintenance:
    <<: *backend-image
    env_file:
      - path: ./backend/.env.ops
        required: false
    command: ["uv", "run", "--no-sync", "python", "scripts/maintenance_worker.py"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  db:
    # ParadeDB 0.26.3 + PostgreSQL 18（pgvector + pg_search，shared_preload 已开）。
    # **按 digest 钉死**：浮动标签会随上游发版漂移。
    # 官方镜像的 PGDATA 是 /var/lib/postgresql/18/docker，卷必须挂父目录。
    # **切镜像必须空卷**（旧 pgdata 卷不迁移）：先 `docker compose down -v`。
    image: paradedb/paradedb:0.26.3-pg18@sha256:9b15fc383bcd771f1e32e222bd1603c4c29856c481f6bd06f1960e89608c02f0
    env_file:
      - path: ./backend/.env.ops
        required: false
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # 必须走 TCP：官方镜像在 init 脚本前会起一个只开 Unix socket 的临时 server，
      # 默认 pg_isready 会命中它，让 init 在最终 server ready 前就开跑。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  pgbouncer:
    # PgBouncer 是 backend 唯一的池：transaction mode，禁用服务端预编译语句。
    # auth_file 由 init 以 0600 写进共享卷（app + owner 两条），admin console 用 owner。
    # **不发布 6432 端口**：admin console 不对公网暴露。
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      LISTEN_PORT: "6432"
      DB_USER: pmstudio_app
      DB_NAME: pmstudio
      AUTH_TYPE: scram-sha-256
      AUTH_FILE: /etc/pgbouncer/auth/userlist.txt
      ADMIN_USERS: pmstudio_owner
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "64"
      DEFAULT_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "4"
      QUERY_WAIT_TIMEOUT: "30"
      MAX_PREPARED_STATEMENTS: "0"
    volumes:
      - pgbouncer-auth:/etc/pgbouncer/auth:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U pmstudio_app -d pmstudio"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PUBLIC_DOMAIN: "http://localhost"
      PMSTUDIO_API_TARGET: "backend:8000"
      PMSTUDIO_WEB_ROOT: /srv
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pmstudio-data:
  fastembed-cache:
  pgdata:
  pgbouncer-auth:
