# PM Studio 的 compose 形态：PostgreSQL + PgBouncer + 后端 + 前端（Caddy）+ Redis。
#
# **用法**：
#   cp backend/.env.example backend/.env   # 填 PMSTUDIO_MODEL / PMSTUDIO_API_KEY
#   docker compose up -d
#   打开 http://localhost
#
# **这份 compose 与 `scripts/dev_stack.sh` 用同一套环境变量名**
# ——那是它们"等价"的根据（`tests/architecture/test_container_assets.py` 盯着）。

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PMSTUDIO_PORT: "8000"
      # backend **只认 app URL**（PgBouncer transaction mode）；直连 URL 只给
      # init / maintenance / backup（T7 的 job 自己注入 `PMSTUDIO_DIRECT_DATABASE_URL`）。
      PMSTUDIO_DATABASE_URL: "postgresql://${POSTGRES_USER:-pmstudio}:${POSTGRES_PASSWORD:-pmstudio}@pgbouncer:6432/${POSTGRES_DB:-pmstudio}"
      # **跨容器反代必须给**：Caddy 在另一个容器里，源 IP 是 Caddy 的。
      # 不给这个 → "每 IP 限流"退化成"全站限流"，**正常用户会互相锁死**
      # （`scripts/dev.py` 的注释点名了这条）。
      PMSTUDIO_FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      # Redis 连不上会自动降级成进程内计数（**不 fail-open 也不 fail-closed**），
      # 但多 worker 的 SSE 扇出会静默退化成进程内 —— 所以给了 redis。
      PMSTUDIO_REDIS_URL: "redis://redis:6379/0"
      # fastembed 的 ONNX 模型缓存（约 90MB）**必须**指到下面挂的卷上。
      # fastembed 的默认缓存目录是 `${TMPDIR}/fastembed_cache`（可用
      # `FASTEMBED_CACHE_PATH` 覆盖）——不显式给的话，容器里它落在 `/tmp` 下，
      # **不挂卷**：每次重建容器都要重下 90MB 模型。
      FASTEMBED_CACHE_PATH: "/root/.cache/fastembed"
    volumes:
      - pmstudio-data:/data
      - fastembed-cache:/root/.cache/fastembed
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # SSE 是长期未完成的响应：关停时必须给够宽限期，
    # 否则 `docker stop` 会把长连接 SIGKILL（`timeout_graceful_shutdown=5` 在 dev.py 里）。
    stop_grace_period: 15s

  db:
    # pgvector 0.8.7 + PostgreSQL 18。**按 digest 钉死**：浮动标签会随上游发版漂移。
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmstudio}
      POSTGRES_USER: ${POSTGRES_USER:-pmstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmstudio}
    volumes:
      # PostgreSQL 18 的 PGDATA 在 /var/lib/postgresql/18/docker；挂父目录兼容官方镜像。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  pgbouncer:
    # PgBouncer 是 backend 唯一的池：transaction mode，禁用服务端预编译语句。
    # **不发布 6432 端口**：admin console 不对公网暴露。
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-pmstudio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pmstudio}
      DB_NAME: ${POSTGRES_DB:-pmstudio}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "64"
      DEFAULT_POOL_SIZE: "10"
      MAX_PREPARED_STATEMENTS: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # 站点地址**有真实来源**：Caddyfile 的 `{$PUBLIC_DOMAIN:...}` 从这里读。
      # 默认 `http://localhost` —— 以 `http://` 开头，Caddy 就**不会**对这个站点
      # 自动签发 HTTPS（本地没有证书，自动 HTTPS 只会把 80 的请求 301 到 443）。
      # 换成真域名时：`PUBLIC_DOMAIN=example.com docker compose up -d`。
      PUBLIC_DOMAIN: "http://localhost"
      # 容器内的反代目标是**服务名**，不是 127.0.0.1（那是 Caddy 自己）。
      PMSTUDIO_API_TARGET: "backend:8000"
      PMSTUDIO_WEB_ROOT: /srv
    ports:
      - "80:80"
    # **等后端真的健康**再收流量：Caddy 反代到一个还没起来的后端 → 用户看到 502，
    # 而不是"页面开了但点什么都失败"。这也让 backend 的 healthcheck 有了消费者
    # （否则它是个**没有消费者的装饰**）。
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pmstudio-data:
  fastembed-cache:
  pgdata:
